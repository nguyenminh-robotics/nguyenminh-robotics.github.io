<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}

{% include comments-providers/scripts.html %}
<script>
(function() {
  const dictionary = {
    // Menu
    "About": "Giới thiệu",
    "Portfolio": "Dự án",
    "Publications": "Công bố",
    "CV": "Lý lịch",
    "Blog": "Bài viết",
    
    // Sidebar
    "Undergraduate in Mechatronics at Hanoi University of Science and Technology.": "Sinh viên ngành Kỹ thuật Cơ điện tử tại Đại học Bách Khoa Hà Nội.",
    "VietNam": "Việt Nam",
    "Hanoi University of Science and Technology": "Đại học Bách Khoa Hà Nội",
    
    // Trang chủ
    "Goals": "Mục tiêu",
    "This website is built to:": "Trang web này được xây dựng nhằm:",
    "Introduce myself and my academic/research orientation": "Giới thiệu bản thân và định hướng học tập, nghiên cứu",
    "Share my personal projects and research findings": "Chia sẻ các dự án cá nhân và kết quả nghiên cứu",
    "Publish my CV and academic activities": "Công bố CV và các hoạt động học thuật",
    "Write blogs about my learning experiences in engineering and robotics": "Viết blog chia sẻ kinh nghiệm tự học về kỹ thuật và robotics"
  };

  // Tạo map ngược
  const revDict = {};
  for (let k in dictionary) {
    revDict[dictionary[k]] = k;
  }

  function translatePage(targetLang) {
    localStorage.setItem("user_lang", targetLang);
    const btn = document.getElementById("lang-toggle-btn");
    if (btn) {
      btn.textContent = (targetLang === "vi") ? "EN" : "VI";
    }

    const dict = (targetLang === "vi") ? dictionary : revDict;

    // Quét và thay thế tất cả các phần tử chứa text
    const elements = document.querySelectorAll("h1, h2, h3, h4, p, li, a, span");
    elements.forEach(el => {
      // Chỉ thay thế text nếu là thẻ đơn, tránh ghi đè mất thẻ con bên trong
      if (el.children.length === 0) {
        const txt = el.textContent.trim();
        if (dict[txt]) {
          el.textContent = dict[txt];
        }
      }
    });

    // Xử lý các khối nội dung dài có gắn data-lang (nếu có)
    document.querySelectorAll("[data-lang]").forEach(el => {
      el.style.display = (el.getAttribute("data-lang") === targetLang) ? "" : "none";
    });
  }

  function initLang() {
    const btn = document.getElementById("lang-toggle-btn");
    if (btn) {
      btn.addEventListener("click", function(e) {
        e.preventDefault();
        const currentLang = localStorage.getItem("user_lang") || "en";
        const nextLang = (currentLang === "en") ? "vi" : "en";
        translatePage(nextLang);
      });
    }

    // Giữ trạng thái khi refresh hoặc sang trang khác
    const saved = localStorage.getItem("user_lang");
    if (saved === "vi") {
      translatePage("vi");
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initLang);
  } else {
    initLang();
  }
})();
</script>
